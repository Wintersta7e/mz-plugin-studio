name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: ${{ github.event_name != 'schedule' && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - run: npm run ci:toolchain
      - run: npm run ci:runtime-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecov
      - run: npm run deps
      - run: npm run knip
      - run: npm run knip:production
      - run: npm run ratchets
        env:
          RATCHETS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run format:check
      - run: npm run licenses -- --check
      - name: Golden commit rules
        run: node scripts/check-golden-commits.mjs --github-event
      - name: Workflow audit (zizmor)
        shell: bash
        env:
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_WHEEL_SHA256: eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          printf 'zizmor==%s --hash=sha256:%s\n' "$ZIZMOR_VERSION" "$ZIZMOR_WHEEL_SHA256" > "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline .github/workflows
      - name: Workflow lint (actionlint)
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -verbose
      - name: Secrets scan, full history (gitleaks)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --no-color --exit-code 1 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          # A scan of zero commits is a failed scan.
          grep -Eq '[1-9][0-9]* commits scanned' "$RUNNER_TEMP/gitleaks.log"
      - name: Dependency advisories (osv-scanner)
        shell: bash
        env:
          OSV_SCANNER_VERSION: 2.6.0
          OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # Any advisory not ignored in osv-scanner.toml, or a failed scan, fails the job.
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile=package-lock.json --config=osv-scanner.toml
      - run: node scripts/ci-policy.mjs osv-ignores

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: ${{ github.event_name != 'schedule' && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - name: No Electron binary in this job
        shell: bash
        run: |
          if [ -e node_modules/electron/dist ]; then
            echo "node_modules/electron/dist: present"
            exit 1
          fi
          echo "node_modules/electron/dist: absent"
      - run: npm run test:coverage
      - name: Changed lines coverage
        shell: bash
        env:
          DIFF_COVER_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$DIFF_COVER_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git merge-base HEAD origin/main)"
          fi
          changed="$(git diff --name-only "$base" HEAD -- src | wc -l)"
          if [ "$changed" -eq 0 ]; then
            echo "diff coverage: no src change"
            exit 0
          fi
          echo "diff coverage: changed src files $changed"
          cat > "$RUNNER_TEMP/diff-cover-requirements.txt" <<'EOF'
          diff-cover==11.0.0 --hash=sha256:8b0a5b356d525718ee18c14b163ce179c75ccdc5b8d5474ef22ade6a0e1fa65d
          chardet==7.7.0 --hash=sha256:feb66c96264e3e6a9ff0c7318ce0028800b6c18ad07c8000d2404a108d1ef767
          jinja2==3.1.6 --hash=sha256:85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
          markupsafe==3.0.4 --hash=sha256:8e124f974786f831d6043728e38296969d3579db8896fe004682f5758e613581
          pluggy==1.7.0 --hash=sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec
          pygments==2.21.0 --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9
          EOF
          python3 -m venv "$RUNNER_TEMP/diff-cover"
          "$RUNNER_TEMP/diff-cover/bin/pip" install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/diff-cover-requirements.txt"
          "$RUNNER_TEMP/diff-cover/bin/diff-cover" coverage/lcov.info --compare-branch="$base" --fail-under=90 --format "json:$RUNNER_TEMP/diff-cover.json"
          node scripts/ci-policy.mjs diff-coverage coverage/lcov.info "$RUNNER_TEMP/diff-cover.json"
      - run: npm run test:golden:coverage
      - name: Clean tree after tests
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi
          echo "git status --porcelain: empty"

  unit-win:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: ${{ github.event_name != 'schedule' && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Clean tree after tests
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi
          echo "git status --porcelain: empty"

  package-win:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: ${{ github.event_name != 'schedule' && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - name: Fixture bytes on a Windows checkout
        run: npm test -- --project node tests/unit/fixture-set.test.ts
      - run: node node_modules/electron/install.js
      - run: node scripts/ci-policy.mjs toolchain --electron
      - run: npm run build
      - run: npm run package:win
      - run: node scripts/ci-policy.mjs package dist/win-unpacked/resources/app.asar
      - name: Fuse wire
        run: node scripts/ci-policy.mjs fuses dist/win-unpacked/mz-plugin-studio.exe
      - run: npm run e2e:prepare -- --reuse
      - run: npm run e2e
      - name: Upload the end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-windows-report
          path: |
            playwright-report/
            test-results/

  e2e-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host --security-opt seccomp=unconfined --user 1001
    env:
      E2E_VISUAL_IMAGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: ${{ github.event_name != 'schedule' && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run e2e:prepare
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e:visual
      - name: Upload the end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-linux-report
          path: |
            playwright-report/
            test-results/

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          output: ${{ runner.temp }}/codeql
      - name: Fail on any CodeQL result
        run: node scripts/ci-policy.mjs codeql "$RUNNER_TEMP/codeql"

  test:
    if: always()
    needs: [static, unit, unit-win, package-win, e2e-linux, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-policy.mjs
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: node scripts/ci-policy.mjs needs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
