[[IgnoredVulns]]
id = "GHSA-6688-9rhm-gjv2"
ignoreUntil = 2027-01-30
reason = "DOMPurify 3.4.15 is vendored inside the code editor (monaco-editor) and no editor release ships a fixed copy. Editor hover text from opened plugin files does reach it, but the editor drops raw HTML before sanitizing and never sets the IN_PLACE option this advisory needs, and the built app's content policy admits no inline script."

