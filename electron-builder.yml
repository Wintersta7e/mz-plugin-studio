appId: com.mzpluginstudio.app
productName: MZ Plugin Studio
copyright: 'Copyright (c) 2026 MZ Plugin Studio Contributors'
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  - THIRD_PARTY_LICENSES.md
asarUnpack:
  - resources/**
win:
  executableName: mz-plugin-studio
  icon: resources/icon.ico
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-portable.${ext}
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Off stops the app loading its own scripts from file://.
  grantFileProtocolExtraPrivileges: true
